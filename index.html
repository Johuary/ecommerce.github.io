<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeConnect – B2B E-Commerce Platform</title>
    <meta name="description" content="Connect buyers with verified global suppliers and factories">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <div class="splash">
            <div class="splash-logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">TradeConnect</span>
            </div>
            <div class="splash-loader"></div>
            <p style="color:var(--text-3);margin-top:8px;font-size:0.85rem">Loading platform…</p>
        </div>
    </div>
    <input type="file" id="img-upload" accept="image/*" style="display:none">
    <div id="toast-container"></div>
    <script src="app.js"></script>
</body>

</html>
